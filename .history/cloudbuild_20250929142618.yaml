# Google Cloud Build configuration for automatic deployment
steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/arnagame-snake:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/arnagame-snake:latest',
      '.'
    ]

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/arnagame-snake:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/arnagame-snake:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'arnagame-snake',
      '--image', 'gcr.io/$PROJECT_ID/arnagame-snake:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '80',
      '--memory', '256Mi',
      '--cpu', '1'
    ]

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/arnagame-snake:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/arnagame-snake:latest'
